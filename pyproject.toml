[project]
name = "troml-dev-status"
version = "0.7.0"
keywords = ["development status","trove classifiers","python packaging"]
description = "Objectively infer PyPI Development Status classifiers from code and release artifacts."
readme = "README.md"
authors = [
    { name = "Matthew Dean Martin", email = "matthewdeanmartin@gmail.com" },
    { name = "Gemini" },
    { name = "ChatGPT" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License"
]


dependencies = [
    "textstat>= 0.7.10",
    "rich>=14.1.0",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "pydantic>=2.11.9",
    "httpx2[http2]>=2.0,<3",
    "pyyaml>=6.0.2",
    "packaging>=25.0",
    "tomlkit>=0.13.3",
    "pathspec>=0.12.1",
    "llvm-diagnostics>=3.0.1",
    "semantic-version>=2.10.0",
    "jinja2>=3.1.6",
    # for counting tests.
    "pytest>0.0.0",
    # For LLM Features. They don't run by accident, so just including them
    # Readme Rater
    "openai>=2.6.1",
    "pydantic_settings>1.0.0",
    "python-dotenv>=1.1.1"
]

[dependency-groups]
dev = [
    "jiggle-version>=2.1.0",
    "keepachangelog-manager-fork[fast]>=6.8.0,<7; python_version < '3.15'",  # [fast] adds orjson+re2; google-re2 has no cp315 wheel on Windows
    "keepachangelog-manager-fork[stdlib]>=6.8.0,<7; python_version >= '3.15'",  # [stdlib] is pure-Python: same features, no native wheels needed
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",

    "pip-licenses",
#    "toml-formatter",
    "bitrab",
    "types-PyYAML",
    "troml",
    "cli-tool-audit",
    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs<2; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "types-retry",
    "types-Markdown",
    "mypy",
    "types-toml",
    # reports

    # build
    "vermin",
    "metametameta>=0.1.14",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "bandit>=1.8.6; python_version >= '3.14'",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    # "pytest-unused-whichfixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/troml_dev_status"
Documentation = "https://troml-dev-status.readthedocs.io/en/latest/"
Changelog = "https://github.com/matthewdeanmartin/troml_dev_status/blob/main/CHANGELOG.md"

homepage = "https://github.com/matthewdeanmartin/troml_dev_status"
issues = "https://github.com/matthewdeanmartin/troml_dev_status/issues/"


[project.scripts]
troml-dev-status = "troml_dev_status.cli:main"
troml_dev_status = "troml_dev_status.cli:main"
readme-rater = "readme_rater.cli:main"
readme_rater = "readme_rater.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/readme_rater/**/*.py",
    "src/readme_rater/py.typed",
    "src/troml_dev_status/**/*.py",
    "src/troml_dev_status/py.typed",
    "/README.md", "/LICENSE",
]

exclude = [

]


[tool.hatch.build.targets.wheel]
packages = ["src/troml_dev_status", "src/readme_rater"]
include = [
    "src/readme_rater/**/*.py",
    "src/readme_rater/py.typed",
    "src/troml_dev_status/**/*.py",
    "src/troml_dev_status/py.typed",
    "/README.md", "/LICENSE",
]


[mypy]
plugins = "pydantic.mypy"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.troml-dev-status]
mode = "application"  # or "library"
use_ai = true

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"

[tool.uv]

[tool.uv.pip]
universal = true

[tool.ruff.lint]
ignore = ["RUF100", "BLE001", "FURB162", "LOG015", "S110", "S112", "SIM102", "SIM103", "TRY004"]  # unused noqa differs across Python versions
